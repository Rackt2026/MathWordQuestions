const el=id=>document.getElementById(id), nav=document.querySelector('nav'), menu=el('topic'), wheel=[...document.querySelectorAll('.wheel button')];
const rules=['道のり ＝ 速さ × 時間','速さ ＝ 道のり ÷ 時間','時間 ＝ 道のり ÷ 速さ'];
let grade=0,idx=0;
function renderMath(element, content) {
  const parts = [];
  let offset = 0;
  for (const match of content.matchAll(/([0-9０-９]+)[/／]([0-9０-９]+)/g)) {
    parts.push(content.slice(offset, match.index));
    const fraction = document.createElement('span');
    fraction.className = 'fraction';
    fraction.setAttribute('role', 'math');
    fraction.setAttribute('aria-label', match[2] + 'ぶんの' + match[1]);
    for (const digits of [match[1], match[2]]) {
      const number = document.createElement('span');
      number.setAttribute('aria-hidden', 'true');
      number.textContent = digits;
      fraction.append(number);
    }
    parts.push(fraction);
    offset = match.index + match[0].length;
  }
  element.replaceChildren(...parts, content.slice(offset));
}
function selectPart(i){wheel.forEach((b,j)=>b.setAttribute('aria-pressed',i===j));el('rule').textContent=rules[i]}
wheel.forEach((b,i)=>b.onclick=()=>selectPart(i));
function show(){const q=data[grade][idx];menu.selectedIndex=Math.floor(idx/10);el('count').textContent=(grade+1)+'年生　・　'+q[0]+'　・　'+(idx%10+1)+' / 10 問';renderMath(el('question'),q[1]);el('unit').textContent=q[3];renderMath(el('point'),q[4]);el('hint').open=false;el('visual').hidden=q[6]===undefined;if(q[6]!==undefined)selectPart(q[6]);el('answer').value='';el('feedback').textContent='';el('next').textContent=idx===data[grade].length-1?'はじめの問題へ ↺':idx%10===9?'つぎのカテゴリーへ →':'つぎの問題へ →'}
function choose(i){grade=i;idx=0;[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));menu.replaceChildren(...data[i].filter((_,j)=>j%10===0).map(q=>new Option(q[0])));show()}
data.forEach((_,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'年生';b.onclick=()=>choose(i);nav.append(b)});
menu.onchange=()=>{idx=menu.selectedIndex*10;show()};el('next').onclick=()=>{idx=(idx+1)%data[grade].length;show()};
function solution(prefix){const q=data[grade][idx];renderMath(el('feedback'),prefix+'　'+q[5]+'　答えは '+q[2]+q[3]+'。');el('hint').open=true;if(q[6]!==undefined)selectPart(q[6])}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const val=el('answer').value.normalize('NFKC').trim();if(/^\d+(\.\d+)?$/.test(val)&&Number(val)===data[grade][idx][2])solution('せいかい！');else el('feedback').textContent='もういちど考えてみよう。「考え方のヒント」も見られるよ。'};
el('explain').onclick=()=>solution('とき方');choose(0);
